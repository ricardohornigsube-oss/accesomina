document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

            <span style=\"font:400 11px/1.3 Inter,sans-serif;color:#5D6B7A;\">Mantenedor mecánico<\u002Fspan>\n            <span style=\"font:400 11px/1.3 Inter,sans-serif;color:#5D6B7A;\">RUT 15.402.881-4<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px;margin-top:4px;font:600 10px/1 Inter,sans-serif;color:#1B7F4B;background:#E8F3EC;border-radius:3px;padding:5px 7px;align-self:flex-start;\"><span style=\"width:6px;height:6px;border-radius:50%;background:#1B7F4B;\"><\u002Fspan>VIGENTE<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:2px;padding:0 14px 10px;\">\n          <span style=\"height:5px;flex:1;border-radius:3px;background:{{ m1 }};\"><\u002Fspan>\n          <span style=\"height:5px;flex:1;border-radius:3px;background:{{ m2 }};\"><\u002Fspan>\n          <span style=\"height:5px;flex:1;border-radius:3px;background:{{ m3 }};\"><\u002Fspan>\n          <span style=\"height:5px;flex:1;border-radius:3px;background:{{ m4 }};\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #E3DED2;padding:9px 14px;display:flex;justify-content:space-between;gap:8px;font:500 9.5px/1 Inter,sans-serif;letter-spacing:0.08em;color:#8A96A1;\">\n          <span>FAENA LOS BRONCES<\u002Fspan><span>VENCE 04·2027<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font:600 10px/1 Inter,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#5D6B7A;\">Credencial de faena<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"border-radius:6px;border:1px solid #DCD5C6;background:#EAE4D6;padding:26px;display:flex;flex-direction:column;gap:16px;\">\n      <div style=\"background:#FFFFFF;border:1px solid #DCD5C6;border-radius:6px;overflow:hidden;flex:1;\">\n        <div style=\"background:{{ m1 }};padding:11px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;\">\n          <dc-import name=\"Pulso\" variante=\"{{ marcaVariante }}\" c1=\"{{ credIso }}\" c2=\"{{ m2 }}\" c3=\"{{ m3 }}\" c4=\"{{ m4 }}\" style=\"width:22px;height:22px;flex:none;\" hint-size=\"22px,22px\"><\u002Fdc-import>\n          <span style=\"font-family:Manrope,sans-serif;font-weight:800;font-size:13.5px;letter-spacing:-0.02em;color:{{ credTxt }};\">Nexo Klar<\u002Fspan>\n          <span style=\"display:flex;gap:14px;font:500 11.5px/1 Inter,sans-serif;color:{{ credMut }};\">\n            <span style=\"color:{{ credTxt }};\">Dotación<\u002Fspan><span>Documentos<\u002Fspan><span>Contratos<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px/1 Inter,sans-serif;color:{{ cajaTexto }};background:{{ m2 }};padding:7px 11px;border-radius:4px;\">Nueva carga<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px 16px;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n            <div style=\"flex:1;min-width:96px;border:1px solid #E3DED2;border-radius:5px;padding:12px;position:relative;overflow:hidden;\">\n              <span style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:{{ m2 }};\"><\u002Fspan>\n              <div style=\"font:500 10px/1 Inter,sans-serif;letter-spacing:0.1em;color:#8A96A1;margin-bottom:8px;\">VIGENTES<\u002Fdiv>\n              <div style=\"font-family:Manrope,sans-serif;font-weight:800;font-size:24px;line-height:1;color:#141A20;\">248<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:96px;border:1px solid #E3DED2;border-radius:5px;padding:12px;position:relative;overflow:hidden;\">\n              <span style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:{{ m3 }};\"><\u002Fspan>\n              <div style=\"font:500 10px/1 Inter,sans-serif;letter-spacing:0.1em;color:#8A96A1;margin-bottom:8px;\">POR VENCER<\u002Fdiv>\n              <div style=\"font-family:Manrope,sans-serif;font-weight:800;font-size:24px;line-height:1;color:#C77700;\">17<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:96px;border:1px solid #E3DED2;border-radius:5px;padding:12px;position:relative;overflow:hidden;\">\n              <span style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:{{ m4 }};\"><\u002Fspan>\n              <div style=\"font:500 10px/1 Inter,sans-serif;letter-spacing:0.1em;color:#8A96A1;margin-bottom:8px;\">NO HABILITADOS<\u002Fdiv>\n              <div style=\"font-family:Manrope,sans-serif;font-weight:800;font-size:24px;line-height:1;color:#B3261E;\">3<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:1px;background:#E3DED2;border:1px solid #E3DED2;border-radius:5px;overflow:hidden;\">\n            <div style=\"background:#FBF9F5;padding:10px 12px;display:flex;align-items:center;gap:12px;font:500 11.5px/1 Inter,sans-serif;color:#5D6B7A;\"><span style=\"flex:1;\">Trabajador<\u002Fspan><span style=\"width:96px;\">Contrato<\u002Fspan><span style=\"width:74px;\">Estado<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#FFFFFF;padding:11px 12px;display:flex;align-items:center;gap:12px;font:400 12px/1 Inter,sans-serif;color:#141A20;\"><span style=\"flex:1;\">R. Fuentes Silva<\u002Fspan><span style=\"width:96px;color:#5D6B7A;\">Indefinido<\u002Fspan><span style=\"width:74px;color:#1B7F4B;font-weight:500;\">Vigente<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#FFFFFF;padding:11px 12px;display:flex;align-items:center;gap:12px;font:400 12px/1 Inter,sans-serif;color:#141A20;\"><span style=\"flex:1;\">M. Cortés Aravena<\u002Fspan><span style=\"width:96px;color:#5D6B7A;\">Por proyecto<\u002Fspan><span style=\"width:74px;color:#C77700;font-weight:500;\">Por vencer<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#FFFFFF;padding:11px 12px;display:flex;align-items:center;gap:12px;font:400 12px/1 Inter,sans-serif;color:#141A20;\"><span style=\"flex:1;\">J. Paredes Muñoz<\u002Fspan><span style=\"width:96px;color:#5D6B7A;\">Por proyecto<\u002Fspan><span style=\"width:74px;color:#B3261E;font-weight:500;\">No habilitado<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font:600 10px/1 Inter,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#5D6B7A;\">Plataforma · las columnas como código de estado<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;\">\n    <div style=\"border-radius:6px;border:1px solid #DCD5C6;background:#EAE4D6;padding:26px;display:flex;flex-direction:column;gap:16px;align-items:center;\">\n      <div style=\"width:100%;max-width:300px;aspect-ratio:85/55;background:{{ fondo }};border:1px solid #DCD5C6;border-radius:6px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;\">\n        <dc-import name=\"Pulso\" variante=\"{{ marcaVariante }}\" c1=\"{{ m1 }}\" c2=\"{{ m2 }}\" c3=\"{{ m3 }}\" c4=\"{{ m4 }}\" style=\"width:38px;height:38px;\" hint-size=\"38px,38px\"><\u002Fdc-import>\n        <div style=\"display:flex;flex-direction:column;gap:3px;\">\n          <span style=\"font:600 12px/1.2 Inter,sans-serif;color:{{ txt }};\">Javier Adinamarca<\u002Fspan>\n          <span style=\"font:400 10.5px/1.3 Inter,sans-serif;color:{{ txtMut }};\">Gerencia general · Nexo Klar<\u002Fspan>\n          <span style=\"font:400 10.5px/1.3 Inter,sans-serif;color:{{ txtMut }};\">javier@nexoklar.cl<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font:600 10px/1 Inter,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#5D6B7A;\">Tarjeta<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"border-radius:6px;border:1px solid #DCD5C6;background:#FFFFFF;padding:24px;display:flex;flex-direction:column;gap:18px;\">\n      <span style=\"font:600 10px/1 Inter,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#8A96A1;\">El ritmo como sistema gráfico<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"display:flex;align-items:flex-end;gap:3px;height:44px;\">\n          <sc-for list=\"{{ franja }}\" as=\"b\" hint-placeholder-count=\"24\">\n            <span style=\"flex:1;border-radius:3px;height:{{ b.h }};background:{{ b.c }};\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n          <span style=\"display:inline-flex;align-items:center;gap:7px;font:500 11.5px/1 Inter,sans-serif;color:#26313A;background:#FBF9F5;border:1px solid #E3DED2;border-radius:20px;padding:7px 12px;\"><span style=\"display:flex;gap:2px;align-items:flex-end;\"><span style=\"width:3px;height:7px;border-radius:2px;background:{{ m1 }};\"><\u002Fspan><span style=\"width:3px;height:11px;border-radius:2px;background:{{ m2 }};\"><\u002Fspan><span style=\"width:3px;height:5px;border-radius:2px;background:{{ m3 }};\"><\u002Fspan><\u002Fspan>Cumplimiento al día<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;font:500 11.5px/1 Inter,sans-serif;color:#26313A;background:#FBF9F5;border:1px solid #E3DED2;border-radius:20px;padding:7px 12px;\"><span style=\"display:flex;gap:2px;align-items:flex-end;\"><span style=\"width:3px;height:11px;border-radius:2px;background:{{ m2 }};\"><\u002Fspan><span style=\"width:3px;height:6px;border-radius:2px;background:{{ m3 }};\"><\u002Fspan><span style=\"width:3px;height:9px;border-radius:2px;background:{{ m4 }};\"><\u002Fspan><\u002Fspan>Dotación en terreno<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #E3DED2;padding-top:14px;font-size:12.5px;line-height:1.6;color:#5D6B7A;text-wrap:pretty;\">Los tacos salen del isotipo y se vuelven separadores, viñetas, barras de carga y códigos de estado. Es lo que hace que la marca no viva sólo en el logo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-radius:6px;border:1px solid #DCD5C6;background:#FFFFFF;padding:22px 26px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;\">\n    <span style=\"font:600 10px/1 Inter,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#8A96A1;\">Regla viva<\u002Fspan>\n    <span style=\"font-size:13.5px;line-height:1.6;color:#26313A;flex:1;min-width:260px;text-wrap:pretty;\">{{ aviso }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"border-radius:6px;background:#2A2A8C;padding:30px 32px;display:flex;flex-direction:column;gap:14px;\">\n    <div style=\"font:600 11px/1 Inter,sans-serif;letter-spacing:0.16em;text-transform:uppercase;color:#00CFC1;\">Para cerrar hoy<\u002Fdiv>\n    <h3 style=\"font-family:Manrope,sans-serif;font-weight:800;font-size:23px;line-height:1.2;letter-spacing:-0.02em;margin:0;color:#FFFFFF;max-width:40ch;text-wrap:pretty;\">Mi recomendación: P5 Tejido como marca, P1 Pulso como reducción y P9 como referencia del logo recibido.<\u002Fh3>\n    <p style=\"margin:0;font-size:15px;line-height:1.65;color:#C7D0D6;max-width:88ch;text-wrap:pretty;\">P5 es el ritmo aprobado con las columnas alternas desfasadas media unidad: aparece el entramado, se siente hecho a mano y deja de leerse como gráfico de barras — que es el único riesgo real del concepto. P1, el que ya votaron, queda como versión de reducción para favicon, credencial y bordado, donde el desfase se pierde. Con eso tienen una marca con textura arriba y una marca sólida abajo, sin rediseñar nada.<\u002Fp>\n    <p style=\"margin:4px 0 0;font-size:13.5px;line-height:1.6;color:#9A9AC4;max-width:88ch;text-wrap:pretty;\">Tres decisiones que necesito de la reunión: el ritmo definitivo, la paleta (mi voto es Serigrafía: índigo, turquesa, ámbar y coral en la cuarta columna) y si el nombre va bicolor o monotono. Con esas tres respuestas dejo el manual y los archivos finales listos.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst PALETA = [\n  [\"#2A2A8C\",\"Índigo\"],[\"#1A1A5E\",\"Índigo profundo\"],[\"#1E3AE0\",\"Cobalto\"],[\"#5B7BFF\",\"Azul claro\"],\n  [\"#00CFC1\",\"Turquesa\"],[\"#00706A\",\"Turquesa tinta\"],[\"#0B3B3A\",\"Petróleo\"],[\"#26313A\",\"Grafito\"],\n  [\"#141A20\",\"Tinta\"],[\"#E9A319\",\"Ámbar\"],[\"#FF5A3C\",\"Coral\"],[\"#E4006E\",\"Magenta\"],\n  [\"#C7D0D6\",\"Gris metal\"],[\"#F4EFE3\",\"Marfil\"],[\"#FFFFFF\",\"Blanco\"]\n];\nconst FONDOS = [\n  [\"#F4EFE3\",\"Marfil\"],[\"#FFFFFF\",\"Blanco\"],[\"#FBF9F5\",\"Hueso\"],[\"#C7D0D6\",\"Gris metal\"],\n  [\"#2A2A8C\",\"Índigo\"],[\"#1A1A5E\",\"Índigo profundo\"],[\"#26313A\",\"Grafito\"],[\"#0B3B3A\",\"Petróleo\"]\n];\nconst VARIANTES = [\n  [\"P1\",\"Pulso\",\"El aprobado\"],\n  [\"P2\",\"Centrado\",\"Eje al medio\"],\n  [\"P3\",\"Onda\",\"Siete columnas\"],\n  [\"P4\",\"Cápsula\",\"Menos y más grande\"],\n  [\"P5\",\"Tejido\",\"Columnas desfasadas\"],\n  [\"P6\",\"Monolito\",\"Tacos casi cuadrados\"],\n  [\"P7\",\"Latido\",\"Con un silencio\"],\n  [\"P8\",\"Diagonal\",\"Base inclinada\"],\n  [\"P9\",\"Pulso · logo final\",\"Aplicaciones recibidas\"]\n];\nconst PRESETS = [\n  [\"Oficial · mezcla F\",\"#2A2A8C\",\"#00CFC1\",\"#1E3AE0\",\"#1A1A5E\",\"#F4EFE3\"],\n  [\"Serigrafía\",\"#2A2A8C\",\"#00CFC1\",\"#E9A319\",\"#FF5A3C\",\"#F4EFE3\"],\n  [\"Cálida · ámbar\",\"#26313A\",\"#E9A319\",\"#FF5A3C\",\"#00706A\",\"#F4EFE3\"],\n  [\"Alta energía\",\"#1E3AE0\",\"#00CFC1\",\"#E4006E\",\"#E9A319\",\"#FFFFFF\"],\n  [\"Faena\",\"#0B3B3A\",\"#E9A319\",\"#00CFC1\",\"#FF5A3C\",\"#F4EFE3\"],\n  [\"Nocturna\",\"#FFFFFF\",\"#00CFC1\",\"#5B7BFF\",\"#FF5A3C\",\"#1A1A5E\"],\n  [\"Una tinta · grafito\",\"#26313A\",\"#26313A\",\"#26313A\",\"#26313A\",\"#F4EFE3\"]\n];\nconst FRANJA = [7,13,20,28,36,44,38,30,24,18,26,34,42,36,28,20,14,22,30,38,32,24,16,10];\n\nfunction lum(hex) {\n  const h = hex.replace(\"#\", \"\");\n  const v = [0, 2, 4].map(i => {\n    const c = parseInt(h.substr(i, 2), 16) / 255;\n    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);\n  });\n  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];\n}\nfunction contraste(a, b) {\n  const x = lum(a), y = lum(b);\n  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);\n}\n\nclass Component extends DCLogic {\n  state = {\n    variante: \"P9\", m1: \"#2A2A8C\", m2: \"#00CFC1\", m3: \"#E9A319\", m4: \"#FF5A3C\",\n    fondo: \"#F4EFE3\", palabra: \"bicolor\", lado: \"izq\",\n    nexoCol: null, klarCol: null\n  };\n\n  set(k, v) { this.setState({ [k]: v }); }\n\n  renderVals() {\n    const s = this.state;\n    const claro = lum(s.fondo) > 0.35;\n    const txt = claro ? \"#141A20\" : \"#FFFFFF\";\n    const txtMut = claro ? \"#8A96A1\" : \"#9A9AC4\";\n    const seguro = c => (contraste(c, s.fondo) >= 2.4 ? c : txt);\n\n    let wNexo = txtMut, wKlar = seguro(s.m1);\n    if (s.palabra === \"mono\") { wNexo = txt; wKlar = txt; }\n    if (s.palabra === \"acento\") { wNexo = txt; wKlar = seguro(s.m2); }\n    if (s.palabra === \"caja\") { wNexo = txt; wKlar = txt; }\n    if (s.nexoCol) wNexo = s.nexoCol;\n    if (s.klarCol) wKlar = s.klarCol;\n\n    const cajaTexto = lum(s.m2) > 0.4 ? \"#141A20\" : \"#FFFFFF\";\n    const claroM1 = lum(s.m1) > 0.45;\n    const credTxt = claroM1 ? \"#141A20\" : \"#FFFFFF\";\n    const credMut = claroM1 ? \"#5D6B7A\" : \"#C7D0D6\";\n    const credIso = claroM1 ? \"#141A20\" : \"#FFFFFF\";\n    const tinta = \"#26313A\";\n\n    const nombreVar = (VARIANTES.find(v => v[0] === s.variante) || [\"\", \"\"])[1];\n\n    const avisos = [];\n    if (contraste(s.m1, s.fondo) < 3) avisos.push(\"Las columnas principales no contrastan lo suficiente con el fondo: bajo 3:1 el isotipo se desvanece impreso en marfil.\");\n    else if (s.m1 === s.m2 && s.m2 === s.m3) avisos.push(\"Con un solo color el ritmo se lee, pero se pierde la lectura de columnas distintas: esa es la versión de una tinta, no la principal.\");\n    else if (s.m4 === \"#FF5A3C\" && s.m3 === \"#E9A319\") avisos.push(\"Ámbar y coral en las dos últimas columnas: es la combinación más cálida y la que más se aleja del software genérico. Ojo: hay que liberar el coral de su rol de alerta en la plataforma.\");\n    else if (contraste(s.m2, s.fondo) < 2) avisos.push(\"La segunda columna casi desaparece sobre este fondo. Súbele el valor o cambia el fondo.\");\n    else avisos.push(\"Combinación conforme: contraste suficiente en las cuatro columnas y jerarquía clara entre estructura y acentos.\");\n\n    const franja = FRANJA.map((h, i) => ({\n      h: h + \"px\",\n      c: [s.m1, s.m2, s.m3, s.m4][i % 4]\n    }));\n\n    return {\n      variante: s.variante, marcaVariante: s.variante === \"P9\" ? \"P1\" : s.variante, esP9: s.variante === \"P9\", nombreVar,\n      m1: s.m1, m2: s.m2, m3: s.m3, m4: s.m4, fondo: s.fondo,\n      txt, txtMut, wNexo, wKlar, cajaTexto, credTxt, credMut, credIso,\n      tinta, tintaMedia: \"#8A96A1\",\n      palabraCaja: s.palabra === \"caja\",\n      palabraPlana: s.palabra !== \"caja\",\n      isoIzq: s.lado === \"izq\",\n      isoArriba: s.lado === \"arriba\",\n      aviso: avisos[0],\n      resumen: [s.m1, s.m2, s.m3, s.m4].join(\"  \"),\n      franja,\n      variantes: VARIANTES.map(([id, nombre]) => ({\n        id, nombre, marcaVariante: id === \"P9\" ? \"P1\" : id,\n        onClick: () => this.set(\"variante\", id),\n        bg: s.variante === id ? \"#2A2A8C\" : \"#FBF9F5\",\n        fg: s.variante === id ? \"#FFFFFF\" : \"#26313A\",\n        bd: s.variante === id ? \"#2A2A8C\" : \"#E3DED2\",\n        mc: s.variante === id ? \"#FFFFFF\" : \"#5D6B7A\"\n      })),\n      galeria: VARIANTES.map(([id, nombre, nota]) => ({\n        id, nombre, nota, marcaVariante: id === \"P9\" ? \"P1\" : id,\n        onClick: () => this.set(\"variante\", id),\n        bg: s.variante === id ? \"#F4EFE3\" : \"#FFFFFF\",\n        fg: s.variante === id ? \"#2A2A8C\" : \"#26313A\",\n        bd: s.variante === id ? \"#2A2A8C\" : \"#E3DED2\"\n      })),\n      slots: [\n        [\"Columna 1 · estructura\", \"m1\", s.m1], [\"Columna 2 · acento\", \"m2\", s.m2],\n        [\"Columna 3\", \"m3\", s.m3], [\"Columna 4 · remate\", \"m4\", s.m4]\n      ].map(([label, key, hex]) => ({\n        label, hex,\n        sw: PALETA.map(([h, nombre]) => ({\n          hex: h, nombre,\n          ring: hex === h ? \"2px solid #141A20\" : \"none\",\n          onClick: () => this.set(key, h)\n        }))\n      })),\n      slotsNombre: [\n        [\"Palabra «Nexo»\", \"nexoCol\", s.nexoCol], [\"Palabra «Klar»\", \"klarCol\", s.klarCol]\n      ].map(([label, key, val]) => ({\n        label, hex: val || \"automático\",\n        sw: [[\"\", \"Automático\", null]].concat(PALETA.map(([h, n]) => [\"\", n, h])).map(([_, nombre, h]) => ({\n          hex: h || \"#FBF9F5\",\n          nombre,\n          etiqueta: h ? \"\" : \"A\",\n          ring: (val || null) === h ? \"2px solid #141A20\" : \"none\",\n          onClick: () => this.set(key, h)\n        }))\n      })),\n      lockNexo: wNexo, lockKlar: wKlar,\n      fondos: FONDOS.map(([h, nombre]) => ({\n        hex: h, nombre,\n        ring: s.fondo === h ? \"2px solid #141A20\" : \"none\",\n        onClick: () => this.set(\"fondo\", h)\n      })),\n      palabras: [[\"bicolor\", \"Bicolor\"], [\"mono\", \"Monotono\"], [\"acento\", \"Klar acento\"], [\"caja\", \"Caja\"]].map(([id, nombre]) => ({\n        nombre,\n        onClick: () => this.set(\"palabra\", id),\n        bg: s.palabra === id ? \"#2A2A8C\" : \"#FBF9F5\",\n        fg: s.palabra === id ? \"#FFFFFF\" : \"#26313A\",\n        bd: s.palabra === id ? \"#2A2A8C\" : \"#E3DED2\"\n      })),\n      lados: [[\"izq\", \"A la izquierda\"], [\"arriba\", \"Arriba\"]].map(([id, nombre]) => ({\n        nombre,\n        onClick: () => this.set(\"lado\", id),\n        bg: s.lado === id ? \"#2A2A8C\" : \"#FBF9F5\",\n        fg: s.lado === id ? \"#FFFFFF\" : \"#26313A\",\n        bd: s.lado === id ? \"#2A2A8C\" : \"#E3DED2\"\n      })),\n      presets: PRESETS.map(([nombre, a, b, c, d, f]) => ({\n        nombre, a, b, c, d,\n        onClick: () => this.setState({ m1: a, m2: b, m3: c, m4: d, fondo: f, nexoCol: null, klarCol: null })\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
